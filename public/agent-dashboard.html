<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard - Universal AI SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <h1 class="text-xl font-bold text-green-600">Universal AI SaaS</h1>
          <span id="teamName" class="ml-4 text-sm text-gray-500"></span>
        </div>
        <div class="flex items-center gap-4">
          <span id="userEmail" class="text-sm text-gray-600"></span>
          <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Welcome Banner -->
    <div class="bg-green-50 border border-green-200 rounded-xl p-6 mb-6">
      <h2 class="text-lg font-semibold text-green-800">👋 Welcome, Agent!</h2>
      <p class="text-sm text-green-700 mt-1">You're responding on behalf of <span id="businessName" class="font-semibold"></span>. Help respond to customer inquiries.</p>
    </div>

    <!-- Live Inbox -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">💬 Team Inbox (Manual Reply)</h3>
      <p class="text-xs text-gray-500 mb-4">Select a customer to reply manually.</p>
      
      <!-- Recent Chats as Cards -->
      <div id="recentChats" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-6 max-h-96 overflow-y-auto p-1">
        <div class="text-center text-gray-400 py-8">Loading conversations...</div>
      </div>

      <!-- Reply Box with Quick Replies -->
      <div id="replyBox" class="hidden bg-white border-2 border-indigo-100 rounded-xl p-5 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm font-bold text-gray-800">Replying to: <span id="replyToNumber" class="text-indigo-600"></span></p>
          <button onclick="closeReplyBox()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        
        <!-- 🚨 Quick Replies Dropdown -->
        <div class="mb-3">
          <label class="block text-xs font-medium text-gray-600 mb-1">⚡ Quick Reply:</label>
          <select id="quickReplies" onchange="insertQuickReply()" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="">-- Select a template --</option>
            <option value="Hello! Thank you for contacting us. How can I assist you today?">👋 Standard Greeting</option>
            <option value="Could you please provide a few more details so I can assist you better?">ℹ️ Request More Info</option>
            <option value="You can reach our official support team at [Insert Email/Phone] for further assistance."> Share Contact Info</option>
            <option value="Thank you for your inquiry. We will get back to you shortly.">⏳ Holding Response</option>
            <option value="Thank you for contacting us! Have a great day.">✅ Closing / Thank You</option>
          </select>
        </div>

        <textarea id="manualReplyText" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none mb-3" placeholder="Type your manual reply..."></textarea>
        <button onclick="sendAgentReply()" class="w-full bg-green-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2">
          <span>📤</span> Send via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    // Check authentication
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login';
    }

    // Decode token to get email
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      document.getElementById('userEmail').textContent = payload.email;
    } catch (e) {
      console.error('Invalid token');
    }

    // Load team info and chats
    async function loadAgentInfo() {
      try {
        const res = await fetch('/api/agent/info', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok && data.team) {
          document.getElementById('teamName').textContent = `Team: ${data.team.businessName}`;
          document.getElementById('businessName').textContent = data.team.businessName;
        }
      } catch (error) {
        console.error('Load agent info error:', error);
      }
    }

    // Load recent chats
    async function loadRecentChats() {
      try {
        const res = await fetch('/api/agent/chats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok && data.chats && data.chats.length > 0) {
          document.getElementById('recentChats').innerHTML = data.chats.map(chat => `
            <div onclick="openReplyBox('${chat.phoneNumber}')" class="p-4 border border-gray-200 rounded-lg hover:border-indigo-300 cursor-pointer transition bg-gray-50 hover:bg-white">
              <div class="flex items-center justify-between mb-2">
                <span class="font-semibold text-gray-800">${chat.phoneNumber}</span>
                <span class="text-xs text-gray-500">${new Date(chat.createdAt).toLocaleString()}</span>
              </div>
              <p class="text-sm text-gray-600 truncate">${chat.lastMessage}</p>
            </div>
          `).join('');
        } else {
          document.getElementById('recentChats').innerHTML = '<div class="text-center text-gray-400 py-8 col-span-full">No recent conversations</div>';
        }
      } catch (error) {
        console.error('Load chats error:', error);
      }
    }

    // 🚨 Quick Reply Function
    function insertQuickReply() {
      const select = document.getElementById('quickReplies');
      const textarea = document.getElementById('manualReplyText');
      const selectedText = select.value;

      if (selectedText) {
        if (textarea.value.trim().length > 0) {
          textarea.value = textarea.value + '\n\n' + selectedText;
        } else {
          textarea.value = selectedText;
        }
        select.value = "";
        textarea.focus();
      }
    }

    function openReplyBox(number) {
      document.getElementById('replyToNumber').textContent = number;
      document.getElementById('replyBox').classList.remove('hidden');
      document.getElementById('manualReplyText').value = '';
      document.getElementById('manualReplyText').focus();
    }

    function closeReplyBox() {
      document.getElementById('replyBox').classList.add('hidden');
    }

    async function sendAgentReply() {
      const number = document.getElementById('replyToNumber').textContent;
      const text = document.getElementById('manualReplyText').value;
      
      if (!text.trim()) {
        alert('Please type a message first.');
        return;
      }

      try {
        const res = await fetch('/api/agent/send-message', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ phoneNumber: number, message: text })
        });

        if (res.ok) {
          alert('✅ Message sent!');
          document.getElementById('manualReplyText').value = '';
          closeReplyBox();
          loadRecentChats();
        } else {
          const data = await res.json();
          alert('❌ Failed to send: ' + data.error);
        }
      } catch (error) {
        alert('❌ Network error. Please try again.');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login';
    }

    // Load on page load
    loadAgentInfo();
    loadRecentChats();
  </script>
</body>
</html>
