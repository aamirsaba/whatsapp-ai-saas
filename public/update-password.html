<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Universal AI SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Change Your Password</h2>
    <p class="text-center text-sm text-gray-600 mb-6">Enter your current password and choose a new one.</p>
    
    <form id="changePasswordForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Current Password</label>
        <div class="relative mt-1">
          <input type="password" id="currentPassword" required class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 pr-10">
          <!-- Password Toggle Button -->
          <button type="button" id="toggleCurrentPassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 focus:outline-none">
            <svg id="currentEyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="currentEyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">New Password (min. 6 characters)</label>
        <div class="relative mt-1">
          <input type="password" id="newPassword" required minlength="6" class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 pr-10">
          <!-- Password Toggle Button -->
          <button type="button" id="toggleNewPassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 focus:outline-none">
            <svg id="newEyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="newEyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200 font-semibold">Update Password</button>
    </form>
    
    <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    
    <p class="mt-6 text-center text-sm text-gray-600">
      <a href="/dashboard" class="font-medium text-gray-500 hover:text-gray-700">← Back to Dashboard</a>
    </p>
  </div>

  <script>
    // Check if user is logged in
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login';
    }

    // Password Toggle Logic for Current Password
    const toggleCurrentPassword = document.getElementById('toggleCurrentPassword');
    const currentPasswordInput = document.getElementById('currentPassword');
    const currentEyeIcon = document.getElementById('currentEyeIcon');
    const currentEyeOffIcon = document.getElementById('currentEyeOffIcon');

    if (toggleCurrentPassword && currentPasswordInput) {
      toggleCurrentPassword.addEventListener('click', () => {
        const type = currentPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        currentPasswordInput.setAttribute('type', type);
        if (currentEyeIcon) currentEyeIcon.classList.toggle('hidden');
        if (currentEyeOffIcon) currentEyeOffIcon.classList.toggle('hidden');
      });
    }

    // Password Toggle Logic for New Password
    const toggleNewPassword = document.getElementById('toggleNewPassword');
    const newPasswordInput = document.getElementById('newPassword');
    const newEyeIcon = document.getElementById('newEyeIcon');
    const newEyeOffIcon = document.getElementById('newEyeOffIcon');

    if (toggleNewPassword && newPasswordInput) {
      toggleNewPassword.addEventListener('click', () => {
        const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        newPasswordInput.setAttribute('type', type);
        if (newEyeIcon) newEyeIcon.classList.toggle('hidden');
        if (newEyeOffIcon) newEyeOffIcon.classList.toggle('hidden');
      });
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const msg = document.getElementById('message');
      const btn = document.getElementById('submitBtn');

      if (newPassword.length < 6) {
        msg.textContent = '❌ New password must be at least 6 characters.';
        msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
        return;
      }

      msg.textContent = 'Updating...';
      msg.className = 'mt-4 text-center text-sm text-gray-600 font-medium';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          msg.textContent = '✅ Password updated successfully! A confirmation email has been sent. Redirecting to login...';
          msg.className = 'mt-4 text-center text-sm text-green-600 font-bold';
          
          setTimeout(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('tenant');
            window.location.href = '/login';
          }, 3000);
        } else {
          msg.textContent = '❌ ' + (data.error || 'Failed to update password. Check your current password.');
          msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = '❌ Network error. Please try again.';
        msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
