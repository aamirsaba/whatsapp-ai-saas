<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Universal AI SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Welcome Back</h2>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <div class="relative mt-1">
          <input type="password" id="password" required class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500 pr-10">
          <!-- Password Toggle Button -->
          <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 focus:outline-none">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="text-sm">
          <!-- 🚨 UPDATED: Points to the correct .html file -->
          <a href="/forgot-password.html" class="font-medium text-green-600 hover:text-green-500">Forgot your password?</a>
        </div>
      </div>

      <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200 font-semibold">Login</button>
    </form>
    
    <p id="message" class="mt-4 text-center text-sm"></p>
    
    <p class="mt-6 text-center text-sm text-gray-600">
      Don't have an account? 
      <a href="/" class="font-medium text-green-600 hover:text-green-500">Register here</a>
    </p>
  </div>

  <script>
    // Password Toggle Logic
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    if (togglePassword && passwordInput) {
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        if (eyeIcon) eyeIcon.classList.toggle('hidden');
        if (eyeOffIcon) eyeOffIcon.classList.toggle('hidden');
      });
    }

    // Login Logic
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('message');

        if (!email || !password) {
          msg.textContent = '❌ Please enter both email and password.';
          msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
          return;
        }

        msg.textContent = 'Logging in...';
        msg.className = 'mt-4 text-center text-sm text-gray-600 font-medium';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const contentType = res.headers.get('content-type');
          if (!contentType || !contentType.includes('application/json')) {
            throw new Error('Server returned non-JSON response');
          }

          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            if (data.tenant) {
              localStorage.setItem('tenant', JSON.stringify(data.tenant));
            }
            
            msg.textContent = '✅ Login successful! Redirecting...';
            msg.className = 'mt-4 text-center text-sm text-green-600 font-bold';
            
            // 🚨 NEW: Check if user needs to change password FIRST
            if (data.requiresPasswordChange) {
              setTimeout(() => {
                window.location.href = '/dashboard?forceChange=true';
              }, 1000);
            } else {
              // Normal redirect based on role
              setTimeout(() => {
                try {
                  const payload = JSON.parse(atob(data.token.split('.')[1]));
                  if (payload.role === 'AGENT') {
                    window.location.href = '/agent-dashboard.html';
                  } else {
                    window.location.href = '/dashboard';
                  }
                } catch (e) {
                  console.error('Token parse error:', e);
                  window.location.href = '/dashboard'; 
                }
              }, 1000);
            }
            
          } else {
            msg.textContent = '❌ ' + (data.error || 'Invalid email or password.');
            msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
          }
        } catch (err) {
          console.error('Login error:', err);
          msg.textContent = '❌ Network or server error. Please try again.';
          msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
        }
      });
    }
  </script>
</body>
</html>
