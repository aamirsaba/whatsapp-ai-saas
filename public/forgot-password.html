<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Universal AI SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Reset Password</h2>
    <p class="text-center text-gray-500 text-sm mb-6">Enter your email and we will send you a new temporary password.</p>
    
    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email Address</label>
        <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200 font-semibold">Send New Password</button>
    </form>
    
    <p id="message" class="mt-4 text-center text-sm"></p>
    
    <p class="mt-6 text-center text-sm text-gray-600">
      <a href="/login" class="font-medium text-green-600 hover:text-green-500">← Back to Login</a>
    </p>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const msg = document.getElementById('message');
      const btn = e.target.querySelector('button');
      
      btn.disabled = true;
      btn.textContent = 'Sending...';
      msg.textContent = '';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        // Always show success for security (don't reveal if email exists)
        msg.textContent = '✅ If an account with this email exists, a new password has been sent to your inbox.';
        msg.className = 'mt-4 text-center text-sm text-green-600 font-bold';
        btn.textContent = 'Sent!';
      } catch (err) {
        msg.textContent = '❌ Server error. Please try again.';
        msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
        btn.disabled = false;
        btn.textContent = 'Send New Password';
      }
    });
  </script>
</body>
</html>
