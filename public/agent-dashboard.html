<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard - Universal AI SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <h1 class="text-xl font-bold text-green-600">Universal AI SaaS</h1>
          <span id="teamName" class="ml-4 text-sm text-gray-500"></span>
        </div>
        <div class="flex items-center gap-4">
          <span id="userEmail" class="text-sm text-gray-600"></span>
          <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Welcome Banner -->
    <div class="bg-green-50 border border-green-200 rounded-xl p-6 mb-6">
      <h2 class="text-lg font-semibold text-green-800">👋 Welcome, <span id="agentNameDisplay">Agent</span>!</h2>
      <p class="text-sm text-green-700 mt-1">
        You're responding on behalf of <span id="businessName" class="font-semibold">your team</span>. 
        <span id="agentContactInfo" class="block mt-1 text-xs text-green-600"></span>
        Help respond to customer inquiries.
      </p>
    </div>

    <!-- Live Inbox -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">💬 Team Inbox (Manual Reply)</h3>
      <p class="text-xs text-gray-500 mb-4">Select a customer to reply manually.</p>
      
      <!-- Recent Chats as Cards -->
      <div id="recentChats" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-6 max-h-96 overflow-y-auto p-1">
        <div class="text-center text-gray-400 py-8 col-span-full">Loading conversations...</div>
      </div>

      <!-- Reply Box with Quick Replies -->
      <div id="replyBox" class="hidden bg-white border-2 border-indigo-100 rounded-xl p-5 shadow-sm">
        
        <!-- 🚨 Chat History Container -->
        <div id="chatHistoryContainer" class="mb-4 p-4 bg-gray-50 rounded-lg max-h-64 overflow-y-auto border border-gray-200 hidden">
          <!-- Messages will be injected here -->
        </div>

        <div class="flex items-center justify-between mb-3">
          <p class="text-sm font-bold text-gray-800">Replying to: <span id="replyToNumber" class="text-indigo-600"></span></p>
          <button onclick="closeReplyBox()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        
        <!-- Quick Replies Dropdown -->
        <div class="mb-3">
          <label class="block text-xs font-medium text-gray-600 mb-1">⚡ Quick Reply:</label>
          <select id="quickReplies" onchange="insertQuickReply()" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="">-- Select a template --</option>
            <option value="Hello! Thank you for contacting us. How can I assist you today?">👋 Standard Greeting</option>
            <option value="Could you please provide a few more details so I can assist you better?">ℹ️ Request More Info</option>
            <option value="You can reach our official support team at [Insert Email/Phone] for further assistance.">📞 Share Contact Info</option>
            <option value="Thank you for your inquiry. We will get back to you shortly.">⏳ Holding Response</option>
            <option value="Thank you for contacting us! Have a great day.">✅ Closing / Thank You</option>
          </select>
        </div>

        <textarea id="manualReplyText" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none mb-3" placeholder="Type your manual reply..."></textarea>
        <button onclick="sendAgentReply()" class="w-full bg-green-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2">
          <span>📤</span> Send via WhatsApp
        </button>
      </div>
    </div>
  </div>

    <script>
    // Check authentication
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login';
    }

    let currentReplyNumber = null;
    let chatHistoryInterval = null;

    // Decode token to get email
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      document.getElementById('userEmail').textContent = payload.email;
    } catch (e) {
      console.error('Invalid token');
    }

    // Load team info and chats
    async function loadAgentInfo() {
      try {
        const res = await fetch('/api/agent/info', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok && data.team) {
          document.getElementById('teamName').textContent = `Team: ${data.team.businessName}`;
          document.getElementById('businessName').textContent = data.team.businessName;
        }
      } catch (error) {
        console.error('Load agent info error:', error);
      }
    }

    // Load recent chats
    async function loadRecentChats() {
      try {
        const res = await fetch('/api/agent/chats', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok && data.chats && data.chats.length > 0) {
          document.getElementById('recentChats').innerHTML = data.chats.map(chat => `
            <div onclick="openReplyBox('${chat.phoneNumber}')" class="p-4 border border-gray-200 rounded-lg hover:border-indigo-300 cursor-pointer transition bg-gray-50 hover:bg-white">
              <div class="flex items-center justify-between mb-2">
                <span class="font-semibold text-gray-800">+${chat.phoneNumber}</span>
                <span class="text-xs text-gray-500">${new Date(chat.lastMessageAt || chat.createdAt).toLocaleString()}</span>
              </div>
              <p class="text-sm text-gray-600 truncate">${chat.lastMessage}</p>
            </div>
          `).join('');
        } else {
          document.getElementById('recentChats').innerHTML = '<div class="text-center text-gray-400 py-8 col-span-full">No recent conversations</div>';
        }
      } catch (error) {
        console.error('Load chats error:', error);
      }
    }

    // 🚨 NEW: Load chat history for a specific number
    async function loadChatHistory(number) {
      try {
        const res = await fetch(`/api/agent/chat-history/${number}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok && data.messages && data.messages.length > 0) {
          const historyContainer = document.getElementById('chatHistoryContainer');
          historyContainer.classList.remove('hidden');
          
          historyContainer.innerHTML = data.messages.map(msg => {
            const isOutbound = msg.direction === 'outbound';
            const alignClass = isOutbound ? 'text-right' : 'text-left';
            const bgClass = isOutbound ? 'bg-green-100 text-green-900 ml-auto' : 'bg-white text-gray-800 border border-gray-200';
            const label = isOutbound ? '👨‍💼 You' : '👤 Customer';
            
            // 🚨 NEW: Show translated text with a small "Translated" badge
            const contentToShow = msg.displayContent || msg.content;
            const translationBadge = msg.isTranslated 
              ? `<span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded ml-2">Translated from original</span>` 
              : '';

            return `
              <div class="mb-3 ${alignClass}">
                <div class="inline-block max-w-xs lg:max-w-md px-3 py-2 rounded-lg ${bgClass} shadow-sm">
                  <div class="flex items-center justify-between mb-1">
                    <p class="text-xs font-semibold opacity-75">${label}</p>
                    ${translationBadge}
                  </div>
                  <p class="text-sm whitespace-pre-wrap">${contentToShow}</p>
                  ${msg.isTranslated ? `<p class="text-xs opacity-50 mt-1 italic border-t border-gray-200 pt-1">Original: ${msg.originalContent}</p>` : ''}
                  <p class="text-xs opacity-60 mt-1 text-right">${new Date(msg.createdAt).toLocaleString()}</p>
                </div>
              </div>
            `;
          }).join('');
          
          // Scroll to bottom
          historyContainer.scrollTop = historyContainer.scrollHeight;
        }
      } catch (error) {
        console.error('Load chat history error:', error);
      }
    }

    //  Quick Reply Function
    function insertQuickReply() {
      const select = document.getElementById('quickReplies');
      const textarea = document.getElementById('manualReplyText');
      const selectedText = select.value;

      if (selectedText) {
        if (textarea.value.trim().length > 0) {
          textarea.value = textarea.value + '\n\n' + selectedText;
        } else {
          textarea.value = selectedText;
        }
        select.value = "";
        textarea.focus();
      }
    }

    async function openReplyBox(number) {
      currentReplyNumber = number;
      document.getElementById('replyToNumber').textContent = '+' + number;
      document.getElementById('replyBox').classList.remove('hidden');
      document.getElementById('manualReplyText').value = '';
      document.getElementById('manualReplyText').focus();
      
      // Load chat history when opening the reply box
      await loadChatHistory(number);
      
      //  Set up auto-refresh every 5 seconds to get new messages
      if (chatHistoryInterval) {
        clearInterval(chatHistoryInterval);
      }
      chatHistoryInterval = setInterval(() => {
        loadChatHistory(number);
        loadRecentChats();
      }, 5000);
      
      // Smooth scroll to reply box
      setTimeout(() => { 
        document.getElementById('replyBox').scrollIntoView({ behavior: 'smooth', block: 'center' }); 
      }, 100);
    }

    function closeReplyBox() {
      currentReplyNumber = null;
      document.getElementById('replyBox').classList.add('hidden');
      
      // Clear the auto-refresh interval
      if (chatHistoryInterval) {
        clearInterval(chatHistoryInterval);
        chatHistoryInterval = null;
      }
    }

    async function sendAgentReply() {
      const number = document.getElementById('replyToNumber').textContent.replace('+', '');
      const text = document.getElementById('manualReplyText').value;
      
      if (!text.trim()) {
        alert('Please type a message first.');
        return;
      }

      try {
        const res = await fetch('/api/agent/send-message', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ phoneNumber: number, message: text })
        });

        if (res.ok) {
          // Immediately reload chat history to show the sent message
          await loadChatHistory(number);
          document.getElementById('manualReplyText').value = '';
        } else {
          const data = await res.json();
          alert('❌ Failed to send: ' + data.error);
        }
      } catch (error) {
        alert('❌ Network error. Please try again.');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login';
    }

    // Load on page load
    loadAgentInfo();
    loadRecentChats();
    
    // Auto-refresh recent chats every 10 seconds
    setInterval(loadRecentChats, 10000);
  </script>
</body>
</html>
