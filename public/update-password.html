<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Universal AI SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Change Your Password</h2>
    <p class="text-center text-sm text-gray-600 mb-6">Enter your current password and choose a new one.</p>
    
    <form id="changePasswordForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Current Password</label>
        <input type="password" id="currentPassword" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">New Password (min. 6 characters)</label>
        <input type="password" id="newPassword" required minlength="6" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 transition duration-200 font-semibold">Update Password</button>
    </form>
    
    <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    
    <p class="mt-6 text-center text-sm text-gray-600">
      <a href="/dashboard" class="font-medium text-gray-500 hover:text-gray-700">← Back to Dashboard</a>
    </p>
  </div>

  <script>
    // Check if user is logged in
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login';
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const msg = document.getElementById('message');
      const btn = document.getElementById('submitBtn');

      if (newPassword.length < 6) {
        msg.textContent = '❌ New password must be at least 6 characters.';
        msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
        return;
      }

      msg.textContent = 'Updating...';
      msg.className = 'mt-4 text-center text-sm text-gray-600 font-medium';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          msg.textContent = '✅ Password updated successfully! A confirmation email has been sent. Redirecting to login...';
          msg.className = 'mt-4 text-center text-sm text-green-600 font-bold';
          
          setTimeout(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('tenant');
            window.location.href = '/login';
          }, 3000);
        } else {
          msg.textContent = '❌ ' + (data.error || 'Failed to update password. Check your current password.');
          msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = '❌ Network error. Please try again.';
        msg.className = 'mt-4 text-center text-sm text-red-600 font-bold';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
