<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Universal AI SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-lg overflow-hidden">
        <div class="bg-gray-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">🚀 5-Minute AI Bot Setup</h1>
            <p class="text-gray-400 text-sm mt-1">Step <span id="stepIndicator">1</span> of 3</p>
            <div class="w-full bg-gray-700 h-1.5 mt-4 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-green-500 h-full transition-all duration-300" style="width: 33%"></div>
            </div>
        </div>

        <form id="wizardForm" class="p-8">
            <!-- STEP 1 -->
            <div id="step1" class="space-y-4">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Create your account</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Work Email</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <button type="button" onclick="nextStep(2)" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition mt-4">Next: Business Details →</button>
            </div>

            <!-- STEP 2 -->
            <div id="step2" class="space-y-4 hidden">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Tell us about your business</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
                    <input type="text" id="businessName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <!-- In Step 2 of register.html, replace the Industry section with this: -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Industry</label>
  <div class="relative">
    <input type="text" id="industry" list="industryList" required placeholder="Start typing to search..." 
      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
    <datalist id="industryList">
      <!-- Professional & Business Services -->
      <option value="General Business / Corporate Services">
      <option value="Real Estate & Property Management">
      <option value="Legal Services / Law Firm">
      <option value="Financial Services & Accounting">
      <option value="Marketing, Advertising & Agency">
      <option value="IT, Software & SaaS">
      <option value="HR, Recruitment & Staffing">
      
      <!-- Health, Wellness & Personal Care -->
      <option value="Medical Clinic & Healthcare">
      <option value="Hospital & Urgent Care">
      <option value="Beauty, Salon & Spa">
      <option value="Fitness, Gym & Personal Training">
      <option value="Mental Health & Counseling">
      <option value="Veterinary & Pet Care">
      
      <!-- Retail, Commerce & Goods -->
      <option value="E-commerce & Online Store">
      <option value="Retail & Brick-and-Mortar Shop">
      <option value="Automotive & Dealership">
      <option value="Wholesale & B2B Distribution">
      
      <!-- On-Demand & Home/Field Services -->
      <option value="Field Services & Home Maintenance">
      <option value="Cleaning Services">
      <option value="Construction, Architecture & Contracting">
      <option value="Logistics, Delivery & Courier">
      
      <!-- Hospitality, Travel & Food -->
      <option value="Restaurant, Cafe & Food Delivery">
      <option value="Hotel, Resort & Hospitality">
      <option value="Travel, Tourism & Event Ticketing">
      <option value="Event Planning & Catering">
      
      <!-- Education, Training & Non-Profit -->
      <option value="School, University & Academy">
      <option value="Online Courses & Tutoring">
      <option value="Non-Profit & Community Organization">
      <option value="Government & Public Services">
      
      <!-- Entertainment, Media & Other -->
      <option value="Coaching & Consulting">
      <option value="Media, Publishing & Content Creation">
      <option value="Other / Not Listed">
    </datalist>
    <div class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">🔍</div>
  </div>
  <p class="text-xs text-gray-500 mt-1">💡 Type to search from 30+ industries</p>
</div>
         <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Website URL (Optional)</label>
                    <input type="url" id="websiteUrl" placeholder="https://..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="prevStep(1)" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-lg font-semibold hover:bg-gray-200 transition">← Back</button>
                    <button type="button" onclick="nextStep(3)" class="flex-1 bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition">Next: Connect WhatsApp →</button>
                </div>
            </div>

            <!-- STEP 3 -->
            <div id="step3" class="space-y-4 hidden">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Connect your WhatsApp</h2>
                <div class="bg-green-50 border border-green-200 p-4 rounded-lg">
                    <p class="text-sm text-green-800 font-medium mb-2">📱 Enter the number you want to automate:</p>
                    <input type="text" id="whatsappNumber" required placeholder="96891293119 (No + or spaces)" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-center font-mono text-lg">
                    <p class="text-xs text-green-600 mt-2 text-center">Keep your existing number. No Meta verification required.</p>
                </div>
                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="prevStep(2)" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-lg font-semibold hover:bg-gray-200 transition">← Back</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2">🚀 Launch My AI Bot</button>
                </div>
            </div>
            <p id="errorMsg" class="text-red-600 text-sm text-center mt-4 hidden"></p>
        </form>
    </div>

    <script>
        let currentStep = 1;
        function nextStep(step) {
            if (step === 2 && (!document.getElementById('email').value || !document.getElementById('password').value)) return showError('Please fill in email and password.');
            if (step === 3 && !document.getElementById('businessName').value) return showError('Please enter your business name.');
            document.getElementById(`step${currentStep}`).classList.add('hidden');
            currentStep = step;
            document.getElementById(`step${currentStep}`).classList.remove('hidden');
            document.getElementById('stepIndicator').textContent = currentStep;
            document.getElementById('progressBar').style.width = `${currentStep * 33.33}%`;
            document.getElementById('errorMsg').classList.add('hidden');
        }
        function prevStep(step) {
            document.getElementById(`step${currentStep}`).classList.add('hidden');
            currentStep = step;
            document.getElementById(`step${currentStep}`).classList.remove('hidden');
            document.getElementById('stepIndicator').textContent = currentStep;
            document.getElementById('progressBar').style.width = `${currentStep * 33.33}%`;
        }
        function showError(msg) {
            const err = document.getElementById('errorMsg');
            err.textContent = msg;
            err.classList.remove('hidden');
        }
        document.getElementById('wizardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '⏳ Creating your AI Employee...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/register-wizard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        businessName: document.getElementById('businessName').value,
                        industry: document.getElementById('industry').value,
                        websiteUrl: document.getElementById('websiteUrl').value,
                        whatsappNumber: document.getElementById('whatsappNumber').value.replace(/\D/g, '')
                    })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.redirectUrl;
                } else {
                    showError(data.error || 'Failed to create account.');
                    btn.innerHTML = '🚀 Launch My AI Bot';
                    btn.disabled = false;
                }
            } catch (err) {
                showError('Server error. Please try again.');
                btn.innerHTML = '🚀 Launch My AI Bot';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
